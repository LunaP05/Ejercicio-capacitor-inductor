<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio - Inductores y Capacitores</title>
  <style>
    :root {
      --primary: #041c00;
      --secondary: #287840;
      --accent: #94c124;
      --bg: #f8fafc;
      --white: #ffffff;
      --border: #cbd5e1;
      --correct: #16a34a;
      --incorrect: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: #1e293b;
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .app-card {
      background: var(--white);
      width: 100%;
      max-width: 840px;
      height: 92vh;
      max-height: 600px;
      border-radius: 12px;
      border: 2px solid var(--primary);
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ENCABEZADO FIJO ARRIBA */
    .sticky-header {
      background: var(--white);
      border-bottom: 2px solid var(--border);
      flex-shrink: 0;
    }

    .header-top {
      background-color: var(--primary);
      color: var(--white);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-top h1 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .score-badge {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--accent);
      padding: 3px 12px;
      border-radius: 20px;
      text-align: right;
    }

    .score-badge .label {
      font-size: 0.6rem;
      color: var(--accent);
      text-transform: uppercase;
      font-weight: 700;
      display: block;
    }

    .score-badge .val {
      font-size: 1rem;
      font-weight: 800;
      color: var(--white);
    }

    .instruction {
      padding: 8px 16px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #0f172a;
      background: #f1f5f9;
      border-bottom: 1px solid var(--border);
    }

    /* BARRA DE SÍMBOLOS RÁPIDOS */
    .symbols-bar {
      display: flex;
      gap: 6px;
      padding: 6px 16px;
      background: #ffffff;
      overflow-x: auto;
      border-bottom: 1px solid var(--border);
    }

    .sym-btn {
      background: #f1f5f9;
      border: 1px solid var(--border);
      color: var(--primary);
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .sym-btn:hover {
      background: var(--secondary);
      color: var(--white);
      border-color: var(--secondary);
    }

    /* PESTAÑAS DE CIRCUITOS */
    .tabs-nav {
      display: flex;
      background: #e2e8f0;
      border-bottom: 2px solid var(--border);
    }

    .tab-btn {
      flex: 1;
      padding: 8px;
      background: transparent;
      border: none;
      font-weight: 700;
      font-size: 0.85rem;
      color: #475569;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--white);
      color: var(--secondary);
      border-bottom: 3px solid var(--secondary);
    }

    /* ÁREA DE CONTENIDO CON SCROLL INTERNO */
    .content-area {
      padding: 14px 16px;
      overflow-y: auto;
      flex-grow: 1;
      background: #ffffff;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    .grid-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .input-group label {
      font-weight: 700;
      font-size: 0.88rem;
      color: var(--primary);
    }

    .input-field-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-field-wrapper input {
      width: 100%;
      padding: 7px 30px 7px 10px;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-field-wrapper input:focus {
      border-color: var(--secondary);
    }

    /* CHULITOS DE ESTADO */
    .status-icon {
      position: absolute;
      right: 10px;
      font-size: 0.9rem;
      font-weight: bold;
      display: none;
    }

    .input-field-wrapper.correct input {
      border-color: var(--correct);
      background-color: #f0fdf4;
    }
    .input-field-wrapper.correct .status-icon {
      color: var(--correct);
      display: block;
    }
    .input-field-wrapper.correct .status-icon::after {
      content: "✔";
    }

    .input-field-wrapper.incorrect input {
      border-color: var(--incorrect);
      background-color: #fef2f2;
    }
    .input-field-wrapper.incorrect .status-icon {
      color: var(--incorrect);
      display: block;
    }
    .input-field-wrapper.incorrect .status-icon::after {
      content: "✖";
    }

    /* PIE FIJO ABAJO CON LOS DOS BOTONES */
    .footer-actions {
      padding: 10px 16px;
      background: #f8fafc;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      flex-shrink: 0;
    }

    .btn-action {
      padding: 8px 18px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-reset {
      background: #e2e8f0;
      color: #334155;
    }
    .btn-reset:hover {
      background: #cbd5e1;
    }

    .btn-verify {
      background: var(--secondary);
      color: var(--white);
    }
    .btn-verify:hover {
      background: #1e5c31;
    }
  </style>
</head>
<body>

<div class="app-card">
  <!-- ENCABEZADO Y CONTROLES FIJOS ARRIBA -->
  <div class="sticky-header">
    <div class="header-top">
      <h1>Ejercicio</h1>
      <div class="score-badge">
        <span class="label">TOTAL</span>
        <span class="val" id="scoreDisplay">0.0 / 5.0</span>
      </div>
    </div>
    
    <div class="instruction">
      Encuentre las cantidades desconocidas para las redes de inductores y capacitores mostradas en la figura.
    </div>

    <!-- BOTONES DE SÍMBOLOS -->
    <div class="symbols-bar">
      <button class="sym-btn" onclick="insertSymbol('mH')">mH</button>
      <button class="sym-btn" onclick="insertSymbol('μH')">μH</button>
      <button class="sym-btn" onclick="insertSymbol('μF')">μF</button>
      <button class="sym-btn" onclick="insertSymbol('F')">F</button>
      <button class="sym-btn" onclick="insertSymbol('m')">m</button>
      <button class="sym-btn" onclick="insertSymbol('μ')">μ</button>
    </div>

    <!-- PESTAÑAS -->
    <div class="tabs-nav">
      <button class="tab-btn active" onclick="switchTab('izq', event)">Circuito Izquierdo (Inductores)</button>
      <button class="tab-btn" onclick="switchTab('der', event)">Circuito Derecho (Capacitores)</button>
    </div>
  </div>

  <!-- ÁREA DE CAMPOS CENTRAL -->
  <div class="content-area">
    <!-- CIRCUITO IZQUIERDO -->
    <div id="tab-izq" class="tab-content active">
      <div class="grid-form">
        <div class="input-group">
          <label><i>L</i><sub>12</sub></label>
          <div class="input-field-wrapper">
            <input type="text" id="l12_izq" data-answers="1.362 mH,1.362mH,1.362 m,1.362m">
            <span class="status-icon"></span>
          </div>
        </div>
        <div class="input-group">
          <label><i>L</i><sub>45</sub></label>
          <div class="input-field-wrapper">
            <input type="text" id="l45_izq" data-answers="4.9 mH,4.9mH,4.9 m,4.9m">
            <span class="status-icon"></span>
          </div>
        </div>
        <div class="input-group">
          <label><i>L</i><sub>p</sub></label>
          <div class="input-field-wrapper">
            <input type="text" id="lp_izq" data-answers="2.848 mH,2.848mH,2.848 m,2.848m">
            <span class="status-icon"></span>
          </div>
        </div>
        <div class="input-group">
          <label><i>L</i><sub>AB</sub></label>
          <div class="input-field-wrapper">
            <input type="text" id="lab_izq" data-answers="4.21 mH,4.21mH,4.21 m,4.21m">
            <span class="status-icon"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- CIRCUITO DERECHO -->
    <div id="tab-der" class="tab-content">
      <div class="grid-form">
        <div class="input-group">
          <label><i>C</i><sub>derecha</sub></label>
          <div class="input-field-wrapper">
            <input type="text" id="cd_der" data-answers="9 μF,9μF,9 μ,9μ">
            <span class="status-icon"></span>
          </div>
        </div>
        <div class="input-group">
          <label><i>C</i><sub>s1</sub></label>
          <div class="input-field-wrapper">
            <input type="text" id="cs1_der" data-answers="1.8 μF,1.8μF,1.8 μ,1.8μ">
            <span class="status-icon"></span>
          </div>
        </div>
        <div class="input-group">
          <label><i>C</i><sub>centro</sub></label>
          <div class="input-field-wrapper">
            <input type="text" id="cc_der" data-answers="8.8 μF,8.8μF,8.8 μ,8.8μ">
            <span class="status-icon"></span>
          </div>
        </div>
        <div class="input-group">
          <label><i>C</i><sub>s2</sub></label>
          <div class="input-field-wrapper">
            <input type="text" id="cs2_der" data-answers="1.63 μF,1.63μF,1.63 μ,1.63μ">
            <span class="status-icon"></span>
          </div>
        </div>
        <div class="input-group">
          <label><i>C</i><sub>ab</sub></label>
          <div class="input-field-wrapper">
            <input type="text" id="cab_der" data-answers="7.63 μF,7.63μF,7.63 μ,7.63μ">
            <span class="status-icon"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- PIE FIJO ABAJO CON LOS DOS BOTONES -->
  <div class="footer-actions">
    <button class="btn-action btn-reset" onclick="resetQuiz()">⟳ Reiniciar</button>
    <button class="btn-action btn-verify" onclick="evaluateQuiz()">✔ Verificar Respuestas</button>
  </div>
</div>

<script>
  let activeInput = null;

  document.querySelectorAll('input').forEach(input => {
    input.addEventListener('focus', () => { activeInput = input; });
  });

  function insertSymbol(sym) {
    if (activeInput) {
      const start = activeInput.selectionStart;
      const end = activeInput.selectionEnd;
      const val = activeInput.value;
      activeInput.value = val.substring(0, start) + sym + val.substring(end);
      activeInput.focus();
      activeInput.setSelectionRange(start + sym.length, start + sym.length);
    }
  }

  function switchTab(tabKey, event) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    
    event.target.classList.add('active');
    document.getElementById(`tab-${tabKey}`).classList.add('active');
  }

  function evaluateQuiz() {
    const inputs = document.querySelectorAll('input[data-answers]');
    let correctCount = 0;
    const totalInputs = inputs.length;

    inputs.forEach(input => {
      const parent = input.parentElement;
      const userVal = input.value.trim().toLowerCase().replace(/\s+/g, '');
      const validAnswers = input.dataset.answers.split(',').map(a => a.trim().toLowerCase().replace(/\s+/g, ''));

      if (userVal !== "" && validAnswers.includes(userVal)) {
        parent.classList.add('correct');
        parent.classList.remove('incorrect');
        correctCount++;
      } else if (userVal !== "") {
        parent.classList.add('incorrect');
        parent.classList.remove('correct');
      } else {
        parent.classList.remove('correct', 'incorrect');
      }
    });

    const finalScore = ((correctCount / totalInputs) * 5.0).toFixed(1);
    document.getElementById('scoreDisplay').innerText = `${finalScore} / 5.0`;
  }

  function resetQuiz() {
    document.querySelectorAll('input[data-answers]').forEach(input => {
      input.value = "";
      input.parentElement.classList.remove('correct', 'incorrect');
    });
    document.getElementById('scoreDisplay').innerText = "0.0 / 5.0";
  }
</script>

</body>
</html>
